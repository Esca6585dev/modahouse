name: modahouse
description: "ModaHouse: moda, içki bezeg, tagamlar we syýahat üçin ideýalar (Android programmasy)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icon: `dart run flutter_launcher_icons`
# (the PNG files are generated locally, see tool/make_icon.py).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#d6336c"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
